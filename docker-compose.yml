services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: zolix-shoecare-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-zolix}
      DB_USERNAME: ${DB_USERNAME:-zolix}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
      RUN_MIGRATIONS: "true"
      RUN_OPTIMIZE: "true"
    volumes:
      - zolix_storage:/var/www/html/storage
      - zolix_public_uploads:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zolix

  queue:
    image: zolix-shoecare-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-zolix}
      DB_USERNAME: ${DB_USERNAME:-zolix}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
      RUN_MIGRATIONS: "false"
      RUN_OPTIMIZE: "false"
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120"]
    volumes:
      - zolix_storage:/var/www/html/storage
      - zolix_public_uploads:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - zolix

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: zolix-shoecare-nginx:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - zolix_public_uploads:/var/www/html/public/storage:ro
    depends_on:
      - app
    networks:
      - zolix

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-zolix}
      POSTGRES_USER: ${DB_USERNAME:-zolix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - zolix_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - zolix

volumes:
  zolix_postgres:
  zolix_storage:
  zolix_public_uploads:

networks:
  zolix:
    driver: bridge
